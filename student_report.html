<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>ABC Senior Secondary School</h1>
    </header>

    <!-- Main Content -->
    <main>
        <section>
            <h2>Student Report</h2>
            <table border="1" cellpadding="5" cellspacing="0" title="Marks of 5 subjects">
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Marks Obtained</th>
                        <th>Maximum Marks</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Mathematics</td>
                        <td>95</td>
                        <td>100</td>
                    </tr>
                    <tr>
                        <td>Physics</td>
                        <td>88</td>
                        <td>100</td>
                    </tr>
                    <tr>
                        <td>Chemistry</td>
                        <td>92</td>
                        <td>100</td>
                    </tr>
                    <tr>
                        <td>English</td>
                        <td>85</td>
                        <td>100</td>
                    </tr>
                    <tr>
                        <td>Computer Science</td>
                        <td>98</td>
                        <td>100</td>
                    </tr>
                    <!-- Total and Percentage Row -->
                    <tr>
                        <td colspan="2" title="Total Marks">Total</td>
                        <td>458 / 500</td>
                    </tr>
                    <tr>
                        <td colspan="2" title="Percentage">Percentage</td>
                        <td>91.6%</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 ABC Senior Secondary School. All Rights Reserved.</p>
    </footer>

</body>
</html>
