<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="tooltip-demo.css">
</head>
<body>
    <header>
        <h1>Tooltip Demonstration (CSS Only)</h1>
    </header>

    <main class="tooltip-container">
        <div class="tooltip">
            <span class="tooltip-text">This is a tooltip for the word!</span>
            Hover over <strong>this word</strong>
        </div>

        <div class="tooltip">
            <span class="tooltip-text">You discovered an icon tooltip!</span>
            💡
        </div>

        <div class="tooltip">
            <span class="tooltip-text">CSS can make tooltips easily!</span>
            🖱️
        </div>
    </main>

    <footer>
        <p>© 2025 Tooltip Practice – CSS Only</p>
    </footer>
</body>
</html>
