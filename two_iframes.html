<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Iframes Example</title>
</head>
<body>

    <h1>Introduction and Hobby</h1>

    <!-- First iframe: Introduction Page -->
    <h2>Introduction</h2>
    <iframe 
        src="introduction.html" 
        width="90%" 
        height="300px" 
        title="Introduction Page" 
        frameborder="1">
    </iframe>

    <br><br>

    <!-- Second iframe: Favorite Hobby Page -->
    <h2>My Favorite Hobby</h2>
    <iframe 
        src="hobby.html" 
        width="90%" 
        height="300px" 
        title="Hobby Page" 
        frameborder="1">
    </iframe>

</body>
</html>
