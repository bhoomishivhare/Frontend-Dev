<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="product-catalog.css">
</head>
<body>
  <header class="text-center py-4 bg-primary text-white">
    <h1>Our Product Catalog</h1>
  </header>

  <main class="container my-5">
    <div class="row g-4">
      <!-- 4 Product Cards -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/300/200?1" class="card-img-top" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Earbuds</h5>
            <p class="card-text">$49.99</p>
            <a href="#" class="btn btn-outline-primary">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/300/200?2" class="card-img-top" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title">Smart Watch</h5>
            <p class="card-text">$89.99</p>
            <a href="#" class="btn btn-outline-primary">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/300/200?3" class="card-img-top" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title">Bluetooth Speaker</h5>
            <p class="card-text">$59.99</p>
            <a href="#" class="btn btn-outline-primary">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <img src="https://picsum.photos/300/200?4" class="card-img-top" alt="Product 4">
          <div class="card-body text-center">
            <h5 class="card-title">Gaming Mouse</h5>
            <p class="card-text">$39.99</p>
            <a href="#" class="btn btn-outline-primary">Add to Cart</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
