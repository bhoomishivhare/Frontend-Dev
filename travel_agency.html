<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Agency Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q10.css">
</head>
<body>

  <header class="bg-primary text-white text-center p-4">
    <h1>Explore the World with Us</h1>
  </header>

  <!-- Carousel -->
  <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="3000">
        <img src="https://picsum.photos/id/1018/1200/500" class="d-block w-100 img-fluid" alt="Beach">
        <div class="carousel-caption">
          <h5>Maldives Paradise</h5>
          <p>Relax in crystal-clear waters.</p>
        </div>
      </div>
      <div class="carousel-item" data-bs-interval="3000">
        <img src="https://picsum.photos/id/1015/1200/500" class="d-block w-100 img-fluid" alt="Mountains">
        <div class="carousel-caption">
          <h5>Swiss Alps</h5>
          <p>Adventure at new heights.</p>
        </div>
      </div>
      <div class="carousel-item" data-bs-interval="3000">
        <img src="https://picsum.photos/id/1025/1200/500" class="d-block w-100 img-fluid" alt="Safari">
        <div class="carousel-caption">
          <h5>African Safari</h5>
          <p>Discover the wild side of nature.</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- Progress Bar -->
  <div class="container my-5">
    <h4 class="text-center mb-3">Booking Progress</h4>
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 70%;">
        70% Completed
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center p-3">
    <p>Contact us: travel@example.com | +91 99999 99999</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
