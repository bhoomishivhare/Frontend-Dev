<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya’s Blog</title>
  <!-- ✅ Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- ✅ Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="custom-blog.css">
</head>
<body>

  <header class="bg-primary text-white text-center py-4">
    <h1 class="fw-bold">Aditya’s Blog</h1>
    <p class="lead">Thoughts. Tech. Creativity.</p>
  </header>

  <main class="container my-5">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <img src="https://picsum.photos/600/300?1" class="card-img-top" alt="Post 1">
          <div class="card-body">
            <h3 class="card-title text-primary">The Power of Minimalism</h3>
            <p class="card-text">Exploring how simplicity enhances focus and creativity.</p>
            <a href="#" class="btn btn-primary">Read More</a>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <img src="https://picsum.photos/600/300?2" class="card-img-top" alt="Post 2">
          <div class="card-body">
            <h3 class="card-title text-primary">Designing for Humans</h3>
            <p class="card-text">A quick dive into user-centered product design principles.</p>
            <a href="#" class="btn btn-primary">Read More</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p>© 2025 Aditya’s Blog | Crafted with Bootstrap</p>
  </footer>
</body>
</html>
