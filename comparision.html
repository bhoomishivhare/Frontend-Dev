<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison.css">
</head>
<body>
  <header>
    <h1>Before and After Image Comparison</h1>
  </header>

  <main class="comparison-container">
    <figure>
      <img src="https://picsum.photos/id/1020/500/350" alt="Original Image">
      <figcaption>Original Image</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1020/500/350" alt="Filtered Image" class="filtered">
      <figcaption>Filtered Image (Brightness Reduced)</figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2025 Filter Comparison Demo</p>
  </footer>
</body>
</html>
