<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="image-showcase.css">
</head>
<body>
    <header>
        <h1>Image Showcase Layout</h1>
        <p>Hover over the images to see scaling and overlay effects.</p>
    </header>

    <main class="gallery">
        <figure>
            <img src="https://picsum.photos/300/200?random=1" alt="Image 1">
            <figcaption>Beautiful Landscape</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/300/200?random=2" alt="Image 2">
            <figcaption>City Lights</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/300/200?random=3" alt="Image 3">
            <figcaption>Peaceful Nature</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/300/200?random=4" alt="Image 4">
            <figcaption>Golden Sunset</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/300/200?random=5" alt="Image 5">
            <figcaption>Ocean Breeze</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/300/200?random=6" alt="Image 6">
            <figcaption>Mountain View</figcaption>
        </figure>
    </main>

    <footer>
        <p>© 2025 CSS Image Showcase</p>
    </footer>
</body>
</html>
