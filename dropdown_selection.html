<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection Page</title>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Choose Your Preferences</h1>
    </header>

    <!-- Main Content -->
    <main>
        <form>
            <!-- Country Dropdown -->
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="india" selected>India</option>
                <option value="usa">USA</option>
                <option value="france">France</option>
                <option value="japan">Japan</option>
            </select>
            <br><br>

            <!-- State Dropdown -->
            <label for="state">State:</label>
            <select id="state" name="state">
                <option value="maharashtra" selected>Maharashtra</option>
                <option value="karnataka">Karnataka</option>
                <option value="delhi">Delhi</option>
            </select>
            <br><br>

            <!-- City Dropdown -->
            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="mumbai" selected>Mumbai</option>
                <option value="pune">Pune</option>
                <option value="bangalore">Bangalore</option>
            </select>
            <br><br>

            <!-- Favorite Tourist Place Dropdown -->
            <label for="tourist">Favorite Tourist Place:</label>
            <select id="tourist" name="tourist">
                <option value="gateway" selected>Gateway of India</option>
                <option value="tajmahal">Taj Mahal</option>
                <option value="bali">Bali Beaches</option>
                <option value="kyoto">Kyoto Temples</option>
            </select>
        </form>

        <!-- Summary Paragraph -->
        <p>You have chosen to travel to <strong>Mumbai, Maharashtra, India</strong> and your favorite tourist place is <strong>Gateway of India</strong>.</p>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Travel Selection Portal. All Rights Reserved.</p>
    </footer>

</body>
</html>
