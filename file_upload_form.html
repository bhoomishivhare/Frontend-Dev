<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>
<body>

    <h1>Upload Your Image</h1>
    <form>
        <label for="file">Choose an image (.jpg or .png):</label>
        <input type="file" id="file" name="file" accept=".jpg,.png" required>
        <br><br>
        <p>Only JPG and PNG files are allowed for upload.</p>
        <input type="submit" value="Upload">
    </form>

</body>
</html>
