<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map Embed</title>
</head>
<body>

    <!-- Embedding Google Map using iframe -->
    <h1>Our School Location</h1>
    
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d241317.11643383264!2d72.74109974902207!3d19.08219783990993!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7b63d1b0e6d1b%3A0x7b122fdfd38ed1f9!2sMumbai%2C%20Maharashtra%2C%20India!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin" 
        width="80%" 
        height="50%" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        title="Google Map of School">
    </iframe>
    
    <!-- 
        The loading="lazy" attribute defers loading of the iframe until it is visible in the viewport.
        This helps improve page load performance.
    -->

</body>
</html>
