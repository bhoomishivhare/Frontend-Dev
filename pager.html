<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Pagination</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q9.css">
</head>
<body class="bg-light">

  <div class="container my-5">
    <h2 class="text-center mb-4">My Blog</h2>
    <p class="lead text-center">Showing 1–3 of 10 posts</p>

    <!-- Pagination -->
    <nav aria-label="Page navigation example">
      <ul class="pagination justify-content-center">
        <li class="page-item"><a class="page-link" href="#">Previous</a></li>
        <li class="page-item"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
      </ul>
    </nav>

    <!-- Pager -->
    <div class="d-flex justify-content-between mt-4">
      <a href="#" class="btn btn-outline-secondary">← Older Posts</a>
      <a href="#" class="btn btn-outline-secondary">Newer Posts →</a>
    </div>
  </div>

</body>
</html>
