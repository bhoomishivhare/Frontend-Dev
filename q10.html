<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini UI Layout</title>
    <link rel="stylesheet" href="mini-ui-layout.css">
</head>
<body>
    <header>
        <h1>Mini UI Layout</h1>
        <p>A responsive profile card layout using Flexbox.</p>
    </header>

    <main class="layout-container">
        <section class="profile-card">
            <img src="https://via.placeholder.com/120" alt="User Photo">
            <h2>Aditya Singh</h2>
            <p>Frontend Enthusiast | Learner | Explorer</p>
            <button>Follow</button>
        </section>

        <section class="profile-card">
            <img src="https://via.placeholder.com/120" alt="User Photo">
            <h2>Priya Mehta</h2>
            <p>UI Designer | Minimalist | Dreamer</p>
            <button>Follow</button>
        </section>

        <section class="profile-card">
            <img src="https://via.placeholder.com/120" alt="User Photo">
            <h2>Ravi Kumar</h2>
            <p>Backend Developer | Debugger | Music Lover</p>
            <button>Follow</button>
        </section>
    </main>

    <footer>
        <p>© 2025 Mini UI Layout Practice</p>
    </footer>
</body>
</html>
