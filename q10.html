<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q10 - Registration Validation</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="q10.js" defer></script>
  <style>
    .invalid { border:2px solid red; }
    .valid { border:2px solid green; }
    .errorMsg { color:red; font-size:12px; }
    form { max-width:400px; }
  </style>
</head>
<body>
  <main>
    <h1>Register</h1>
    <form id="regForm" novalidate>
      <div>
        <label for="name">Name</label><br />
        <input id="name" name="name" /><div class="errorMsg" id="errName"></div>
      </div>
      <div>
        <label for="email">Email</label><br />
        <input id="email" name="email" /><div class="errorMsg" id="errEmail"></div>
      </div>
      <div>
        <label for="password">Password</label><br />
        <input id="password" name="password" type="password" /><div class="errorMsg" id="errPassword"></div>
      </div>
      <button type="submit">Register</button>
      <div id="success" style="display:none;color:green;margin-top:8px;">Registration successful!</div>
    </form>
  </main>
</body>
</html>
