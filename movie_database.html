<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Database</title>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>My Movie Database</h1>
    </header>

    <!-- Movie Table -->
    <main>
        <table border="1" cellpadding="5" cellspacing="0" title="List of movies with details">
            <caption><strong>Top Movies of 2025</strong></caption>
            <thead>
                <tr>
                    <th>Movie Name</th>
                    <th>Genre</th>
                    <th>Year</th>
                    <th>IMDB Rating</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Inception</td>
                    <td>Sci-Fi</td>
                    <td>2010</td>
                    <td>8.8</td>
                    <td><a href="https://www.imdb.com/title/tt1375666/" target="_blank">IMDB</a></td>
                </tr>
                <tr>
                    <td>Interstellar</td>
                    <td>Adventure</td>
                    <td>2014</td>
                    <td>8.6</td>
                    <td><a href="https://www.imdb.com/title/tt0816692/" target="_blank">IMDB</a></td>
                </tr>
                <tr>
                    <td>The Dark Knight</td>
                    <td>Action</td>
                    <td>2008</td>
                    <td>9.0</td>
                    <td><a href="https://www.imdb.com/title/tt0468569/" target="_blank">IMDB</a></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="5"><small>Note: Ratings are sourced from IMDB as of 2025.</small></td>
                </tr>
            </tfoot>
        </table>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Movie Database. All Rights Reserved.</p>
    </footer>

</body>
</html>
