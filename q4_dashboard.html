<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Q4 Multi-API Dashboard</title>
  <style>
    body{font-family:Arial;margin:20px}
    .card{display:inline-block;padding:16px;margin:8px;border-radius:8px;width:180px;height:110px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
    .skeleton{background:#eee;height:20px;margin:8px 0;border-radius:4px}
    .warning{color:#b00020;margin-top:12px}
  </style>
</head>
<body>
  <h2>Dashboard</h2>
  <div id="area">
    <div class="card"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:40%"></div></div>
    <div class="card"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:40%"></div></div>
    <div class="card"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:40%"></div></div>
  </div>
  <div id="warning" class="warning" style="display:none">Some data could not be loaded.</div>

<script>
const base = 'http://localhost:3004';
const endpoints = ['/users','/orders','/products'];

function showData(usersCount, ordersCount, productsCount, someFailed){
  const area = document.getElementById('area');
  area.innerHTML = '';
  const createCard = (title, value) => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<div style="font-size:14px;color:#666">${title}</div><div style="font-size:28px;margin-top:8px">${value}</div>`;
    return d;
  };
  area.appendChild(createCard('Total Users', usersCount));
  area.appendChild(createCard('Total Orders', ordersCount));
  area.appendChild(createCard('Total Products', productsCount));
  document.getElementById('warning').style.display = someFailed ? 'block' : 'none';
}

function loadAll(){
  const requests = endpoints.map(ep => fetch(base + ep).then(r=>{
    if(!r.ok) throw new Error('Fetch failed ' + ep);
    return r.json();
  }));
  Promise.allSettled(requests).then(results=>{
    let usersCount = '—', ordersCount = '—', productsCount = '—';
    let anyFailed = false;
    results.forEach((res, idx) => {
      if(res.status === 'fulfilled'){
        const arr = res.value;
        if(endpoints[idx] === '/users') usersCount = arr.length;
        if(endpoints[idx] === '/orders') ordersCount = arr.length;
        if(endpoints[idx] === '/products') productsCount = arr.length;
      } else {
        anyFailed = true;
        console.error('Failed:', endpoints[idx], res.reason);
      }
    });
    showData(usersCount, ordersCount, productsCount, anyFailed);
  }).catch(err=>{
    console.error(err);
    showData('—','—','—', true);
  });
}

loadAll();
</script>
</body>
</html>
