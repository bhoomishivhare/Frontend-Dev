<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security Example</title>
</head>
<body>

    <h1>Secure Form</h1>
    <form autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <input type="submit" value="Login">
    </form>

    <p>Turning off autocomplete prevents the browser from saving sensitive information, improving security.</p>

</body>
</html>
