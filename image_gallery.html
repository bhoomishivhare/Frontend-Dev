<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-gallery.css" />
</head>
<body>
  <header>
    <h1>Responsive Image Filter Gallery</h1>
  </header>

  <main class="gallery">
    <!-- Each figure contains an image and its caption -->
    <figure>
      <img src="https://picsum.photos/id/1015/400/300" alt="Mountain View" class="filter-blur" />
      <figcaption>Blur Filter</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1025/400/300" alt="Dog" class="filter-grayscale" />
      <figcaption>Grayscale Filter</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1035/400/300" alt="Bridge" class="filter-sepia" />
      <figcaption>Sepia Filter</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1045/400/300" alt="Forest" class="filter-brightness" />
      <figcaption>Brightness Filter</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1055/400/300" alt="Beach" class="filter-contrast" />
      <figcaption>Contrast Filter</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1065/400/300" alt="City" class="filter-hue" />
      <figcaption>Hue Rotate Filter</figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2025 Responsive Gallery Demo</p>
  </footer>
</body>
</html>
