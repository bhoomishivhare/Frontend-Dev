<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q8.css">
</head>
<body class="bg-light">

  <section class="container text-center my-5">
    <h2 class="mb-4">Choose Your Plan</h2>
    <div class="row g-4">
      <!-- Basic -->
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="card-title">Basic</h4>
            <p class="display-6">$9/mo</p>
            <ul class="list-unstyled">
              <li>✔ 10 Projects</li>
              <li>✔ Basic Support</li>
              <li>✖ Custom Domain</li>
            </ul>
            <button class="btn btn-outline-primary mt-3">Select</button>
          </div>
        </div>
      </div>

      <!-- Pro -->
      <div class="col-md-4">
        <div class="card text-white bg-primary shadow-lg">
          <div class="card-body">
            <h4 class="card-title">Pro</h4>
            <p class="display-6">$19/mo</p>
            <ul class="list-unstyled">
              <li>✔ Unlimited Projects</li>
              <li>✔ 24/7 Support</li>
              <li>✔ Custom Domain</li>
            </ul>
            <button class="btn btn-light mt-3">Select</button>
          </div>
        </div>
      </div>

      <!-- Enterprise -->
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="card-title">Enterprise</h4>
            <p class="display-6">$49/mo</p>
            <ul class="list-unstyled">
              <li>✔ Dedicated Server</li>
              <li>✔ Priority Support</li>
              <li>✔ Team Collaboration</li>
            </ul>
            <button class="btn btn-outline-primary mt-3">Select</button>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
