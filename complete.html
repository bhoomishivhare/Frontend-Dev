<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Webpage</title>
  <link rel="stylesheet" href="complete.css">
</head>
<body>
  <header>
    <nav>
      <h1>My Website</h1>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to My Website</h2>
  </section>

  <section id="about" class="about">
    <div class="text">
      <h2>About Us</h2>
      <p>We are passionate about delivering quality services with integrity and creativity.</p>
    </div>
    <div class="image">
      <img src="about.jpg" alt="About Image">
    </div>
  </section>

  <section id="services" class="services">
    <div class="service-box">Service 1</div>
    <div class="service-box">Service 2</div>
    <div class="service-box">Service 3</div>
  </section>

  <section id="contact" class="contact">
    <form>
      <h2>Contact Us</h2>
      <input type="text" placeholder="Name">
      <input type="email" placeholder="Email">
      <textarea rows="4" placeholder="Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>© 2025 My Website. All rights reserved.</p>
  </footer>
</body>
</html>
