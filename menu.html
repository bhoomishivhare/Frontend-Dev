<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="restaurant-menu.css">
</head>
<body>

  <header class="bg-danger text-white text-center py-4">
    <h1>Chef's Delight</h1>
    <p class="lead">Today's Menu</p>
  </header>

  <main class="container my-5">
    <div class="text-center mb-4">
      <img src="https://picsum.photos/600/300" alt="Food" class="img-fluid rounded shadow">
      <p class="mt-2 text-muted">A glimpse of our signature dish</p>
    </div>

    <!-- ✅ Menu Table -->
    <table class="table table-bordered text-center">
      <thead class="table-dark">
        <tr>
          <th>Category</th>
          <th>Item</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Starter</td><td>Tomato Soup</td><td>$5</td></tr>
        <tr><td>Main Course</td><td>Grilled Salmon</td><td>$15</td></tr>
        <tr><td>Dessert</td><td>Chocolate Lava Cake</td><td>$8</td></tr>
      </tbody>
    </table>

    <!-- ✅ Chef Specials -->
    <h3 class="mt-5 text-center">Chef’s Specials</h3>
    <ul class="list-group w-75 mx-auto">
      <li class="list-group-item">Spicy Thai Curry</li>
      <li class="list-group-item">BBQ Ribs</li>
      <li class="list-group-item">Stuffed Pasta Rolls</li>
    </ul>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Chef's Delight</p>
  </footer>
</body>
</html>
