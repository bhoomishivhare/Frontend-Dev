<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q7.css">
</head>
<body class="bg-light">

  <div class="container my-5">
    <header class="text-center mb-4">
      <h2>My Tasks <span class="badge bg-secondary">4 Pending</span></h2>
    </header>

    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Finish Bootstrap Assignment
        <span class="badge bg-danger rounded-pill">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Review Notes
        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Workout
        <span class="badge bg-success rounded-pill">Low</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Call Friend
        <span class="badge bg-primary rounded-pill">Medium</span>
      </li>
    </ul>

    <div class="text-center mt-4">
      <button class="btn btn-success">
        Completed <span class="badge bg-light text-dark">2</span>
      </button>
    </div>
  </div>

</body>
</html>
