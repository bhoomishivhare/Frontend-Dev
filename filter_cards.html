<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="filter-cards.css" />
</head>
<body>
  <header>
    <h1>Profile Cards with Filters</h1>
  </header>

  <main class="card-container">
    <article class="card">
      <img src="https://picsum.photos/id/1011/300/200" alt="Profile 1" />
      <h2>John Doe</h2>
      <p>Web Designer</p>
    </article>

    <article class="card">
      <img src="https://picsum.photos/id/1012/300/200" alt="Profile 2" />
      <h2>Jane Smith</h2>
      <p>Frontend Developer</p>
    </article>

    <article class="card">
      <img src="https://picsum.photos/id/1013/300/200" alt="Profile 3" />
      <h2>Alex Johnson</h2>
      <p>UI/UX Expert</p>
    </article>
  </main>

  <footer>
    <p>&copy; 2025 Filter Cards Demo</p>
  </footer>
</body>
</html>
