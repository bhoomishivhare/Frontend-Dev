<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="styled-buttons.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
        <p>Demonstrating different button types and pseudo-classes.</p>
    </header>

    <main class="button-container">
        <button class="btn primary">Primary Button</button>
        <button class="btn secondary">Secondary Button</button>
        <button class="btn outline">Outline Button</button>
        <button class="btn" disabled>Disabled Button</button>
    </main>

    <footer>
        <p>© 2025 CSS Button Styles</p>
    </footer>
</body>
</html>
