<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotations Example</title>
</head>
<body>

    <h1>Quotations</h1>

    <!-- Long quote -->
    <blockquote>
        "The only limit to our realization of tomorrow is our doubts of today." &amp;
    </blockquote>

    <!-- Short quote inside a paragraph -->
    <p>As Einstein once said, <q>Imagination is more important than knowledge.</q></p>

</body>
</html>
