<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth Effects</title>
  <link rel="stylesheet" href="shadows.css">
</head>
<body>
  <header>
    <h1>CSS Shadows and Depth Effects</h1>
  </header>

  <main>
    <section class="card-container">
      <div class="card light-shadow">
        <h2>Card 1</h2>
        <p>Simple shadow for subtle depth.</p>
      </div>
      <div class="card medium-shadow">
        <h2>Card 2</h2>
        <p>Medium shadow for a more pronounced lift.</p>
      </div>
      <div class="card heavy-shadow">
        <h2>Card 3</h2>
        <p>Strong shadow for dramatic depth.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Hover over the cards to see lift-up animation!</p>
  </footer>
</body>
</html>
