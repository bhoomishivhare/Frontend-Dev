<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="notifications-dashboard.css">
</head>
<body class="bg-light">

  <header class="text-center bg-primary text-white py-3">
    <h1>Dashboard Alerts</h1>
  </header>

  <main class="container my-5">
    <!-- ✅ Summary Well -->
    <div class="bg-white p-4 border rounded mb-4 shadow-sm">
      <h4 class="mb-3">Summary</h4>
      <p>You have 3 new messages, 2 tips, and 1 warning today.</p>
    </div>

    <!-- ✅ Bootstrap Alerts -->
    <div class="alert alert-success">✅ New Message: Project approved!</div>
    <div class="alert alert-info">ℹ️ Tip: Try the new analytics dashboard.</div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      ⚠️ Warning: Low disk space!
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  </main>

  <footer class="text-center bg-dark text-white py-3">
    <p>© 2025 Notification Center</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
