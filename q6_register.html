<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Q6 Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body{font-family:Arial;margin:20px}
    form{max-width:420px}
    label{display:block;margin:8px 0 4px}
    input{width:100%;padding:8px;box-sizing:border-box}
    button{margin-top:12px;padding:8px 16px}
    .msg{margin-top:12px}
  </style>
</head>
<body>
  <h2>Register</h2>
  <form id="form">
    <label>Name</label>
    <input id="name" required/>
    <label>Email</label>
    <input id="email" type="email" required/>
    <button type="submit">Register</button>
  </form>
  <div id="msg" class="msg"></div>

<script>
const API = 'http://localhost:3006/users';
const form = document.getElementById('form');
const msg = document.getElementById('msg');

form.addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  if(!email) return;
  msg.textContent = 'Checking...';

  // check duplicate
  axios.get(API + '?email=' + encodeURIComponent(email))
    .then(res=>{
      if(res.data && res.data.length > 0){
        msg.style.color = 'crimson';
        msg.textContent = 'Email already registered.';
      } else {
        // create new
        axios.post(API, { name, email })
          .then(resp=>{
            msg.style.color = 'green';
            msg.textContent = 'Registration successful!';
            form.reset();
          })
          .catch(err=>{
            msg.style.color = 'crimson';
            msg.textContent = 'Failed to register. Try again.';
          });
      }
    })
    .catch(err=>{
      msg.style.color = 'crimson';
      msg.textContent = 'Failed to check email. Try again.';
    });
});
</script>
</body>
</html>
