<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q7 - Search Courses</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="q7.js" defer></script>
  <style>
    .course { padding:8px; border-bottom:1px solid #eee; }
    .matched { background:#fff7e6; }
  </style>
</head>
<body>
  <main>
    <h1>Courses</h1>
    <input id="search" placeholder="Search courses..." />
    <button id="clear">Clear</button>
    <div id="count">Matched: 0</div>
    <section id="courses">
      <div class="course">JavaScript Basics</div>
      <div class="course">Advanced CSS Layouts</div>
      <div class="course">React for Beginners</div>
      <div class="course">Node.js & Express</div>
      <div class="course">Data Structures in JS</div>
    </section>
  </main>
</body>
</html>
