<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q8 - Blog Posts</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="q8.js" defer></script>
  <style>
    .post { border:1px solid #ddd; padding:8px; margin:8px 0; }
    .tag { color:#555; margin-right:6px; }
    .highlight { background:#fff3f0; }
  </style>
</head>
<body>
  <main>
    <h1>Blog Admin</h1>
    <button id="addPost">Add New Post</button>
    <button id="prependFeatured">Prepend Featured</button>
    <button id="removeLast">Remove Last Post</button>
    <div id="posts">
      <div class="post">Post about JavaScript</div>
      <div class="post">CSS Tips & Tricks</div>
      <div class="post">Node Performance Tuning</div>
      <div class="post">Accessibility Best Practices</div>
      <div class="post">Testing with Jest</div>
    </div>
    <div style="margin-top:8px;">
      <input id="tagText" placeholder="Tag name" />
      <button id="addTagToAll">Add Tag to All</button>
    </div>
  </main>
</body>
</html>
