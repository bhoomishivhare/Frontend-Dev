<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Exploration</title>
  <link rel="stylesheet" href="boxmodel.css">
</head>
<body>
  <header>
    <h1>Box Model Demonstration</h1>
  </header>

  <main>
    <section class="container">
      <div class="box">
        <p>Content Area</p>
      </div>
      <div class="box border-box">
        <p>Box-Sizing: Border-Box</p>
      </div>
    </section>

    <section class="description">
      <p>The <strong>Box Model</strong> includes content, padding, border, and margin layers. The <mark>box-sizing: border-box</mark> property makes the box include padding and border inside the total width and height.</p>
    </section>
  </main>

  <footer>
    <p>Visual representation of CSS Box Model</p>
  </footer>
</body>
</html>
